<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Display</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: inherit; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: sans-serif;
    color: #f5f5f7;
    background: #0d0d16;
    background: -webkit-linear-gradient(top, #1b1b32 0%, #0d0d16 100%);
    background: linear-gradient(180deg, #1b1b32 0%, #0d0d16 100%);
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-justify-content: space-between; justify-content: space-between;
    padding: 32px 36px;
  }
  .top {
    display: -webkit-flex; display: flex;
    -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: center; align-items: center;
  }
  #clock { font-size: 110px; font-weight: 300; letter-spacing: 3px; line-height: 1; text-shadow: 0 4px 24px rgba(120,130,255,0.35); }
  #date { font-size: 26px; color: #9fa3c4; margin-top: 10px; text-transform: capitalize; letter-spacing: 1px; }

  .weather-box {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    padding: 20px 28px; border-radius: 22px; font-size: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .top-right { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #refreshBtn, #settingsBtn {
    width: 72px; height: 72px; border-radius: 36px; margin-left: 16px; border: none; outline: none;
    background: rgba(255,255,255,0.10); color: #fff;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    -webkit-flex-shrink: 0; flex-shrink: 0;
  }
  #refreshBtn svg, #settingsBtn svg { width: 34px; height: 34px; fill: currentColor; }
  #refreshBtn:active, #settingsBtn:active { background: #5865f2; }
  .weather-box svg { width: 40px; height: 40px; fill: #ffd166; margin-right: 16px; -webkit-flex-shrink: 0; flex-shrink: 0; }

  .media-box {
    display: -webkit-flex; display: flex;
    -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: center; align-items: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    padding: 24px 28px; border-radius: 26px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .track {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-flex: 1; flex: 1; min-width: 0;
  }
  .cover {
    width: 84px; height: 84px; border-radius: 18px; margin-right: 22px;
    -webkit-flex-shrink: 0; flex-shrink: 0;
    background: #5865f2;
    background: -webkit-linear-gradient(135deg, #7b86ff, #4a3fd1);
    background: linear-gradient(135deg, #7b86ff, #4a3fd1);
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  .cover svg { width: 44px; height: 44px; fill: #fff; }
  .track-info { -webkit-flex: 1; flex: 1; min-width: 0; padding-right: 16px; }
  #title { font-size: 30px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: 20px; color: #9fa3c4; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .controls button {
    background: rgba(255,255,255,0.10); color: #fff; border: none;
    width: 72px; height: 72px; margin-left: 14px; border-radius: 36px;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    outline: none;
  }
  .controls button svg { width: 34px; height: 34px; fill: currentColor; }
  .controls button:active { background: #5865f2; }
  .controls #playBtn { width: 88px; height: 88px; border-radius: 44px; background: #5865f2; }
  .controls #playBtn svg { width: 44px; height: 44px; }
  .controls #playBtn:active { background: #7b86ff; }
  .controls #modeBtn { width: auto; border-radius: 22px; height: 52px; font-size: 18px; font-weight: bold; padding: 0 20px; margin-left: 0; margin-right: 10px; background: rgba(255,255,255,0.14); letter-spacing: 1px; }

  .rcol { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: stretch; align-items: stretch; }
  .rcol .top-right { -webkit-justify-content: flex-end; justify-content: flex-end; }
  #cal { margin-top: 14px; min-width: 300px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.10); border-radius: 18px; padding: 10px 14px; }
  #cal .ct { font-size: 18px; font-weight: bold; text-transform: capitalize; text-align: center; margin-bottom: 4px; }
  #cal table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #cal th { font-size: 13px; color: #9fa3c4; font-weight: normal; padding: 2px 0; }
  #cal td { font-size: 16px; text-align: center; height: 29px; color: #e6e7f5; }
  #cal td.su { color: #ff9aa8; }
  #cal td.t span { display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 14px; background: #5865f2; color: #fff; font-weight: bold; }
  #news { margin-top: 26px; max-width: 620px; opacity: 1; -webkit-transition: opacity 0.3s; transition: opacity 0.3s; }
  #news .lbl { font-size: 14px; letter-spacing: 3px; color: #7b86ff; font-weight: bold; margin-bottom: 6px; }
  #newsText { font-size: 22px; line-height: 1.3; color: #d6d8f0; height: 58px; overflow: hidden; }

  /* Velo scuro per la luminosita' programmata */
  #dim { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; z-index: 999; }

  /* Player YouTube (quasi invisibile, ma presente nella pagina) */
  #ytBox { position: fixed; right: 0; bottom: 0; width: 200px; height: 200px; opacity: 0.01; pointer-events: none; z-index: 0; }

  /* Pannello impostazioni */
  #panel {
    display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75); z-index: 500;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  #panel.open { display: -webkit-flex; display: flex; }
  .card {
    width: 92%; max-width: 640px; max-height: 92%;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #1c1c30; border-radius: 24px; padding: 26px 28px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .card h2 { font-size: 30px; margin-bottom: 18px; }
  .card label { display: block; font-size: 20px; color: #9fa3c4; margin: 18px 0 8px 0; }
  .card input[type=text], .card select {
    width: 100%; font-size: 22px; padding: 12px 14px; border-radius: 12px; border: none; outline: none;
    background: rgba(255,255,255,0.10); color: #fff;
  }
  .card select option { color: #000; }
  .card input[type=range] { width: 100%; height: 36px; }
  .card .hint { font-size: 16px; color: #7c80a0; margin-top: 6px; }
  .row { display: -webkit-flex; display: flex; }
  .row > div { -webkit-flex: 1; flex: 1; margin-right: 12px; }
  .row > div:last-child { margin-right: 0; }
  .check { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 22px; margin-top: 22px; color: #f5f5f7; }
  .check input { width: 30px; height: 30px; margin-right: 14px; }
  #swatches { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .sw { width: 60px; height: 60px; border-radius: 30px; margin: 0 12px 12px 0; border: 4px solid transparent; outline: none; }
  .sw.sel { border-color: #fff; }
  #fMsg { color: #ff8a8a; font-size: 18px; margin-top: 14px; min-height: 22px; }
  .btns { display: -webkit-flex; display: flex; margin-top: 18px; }
  .btns button { -webkit-flex: 1; flex: 1; font-size: 22px; font-weight: bold; padding: 16px; border-radius: 14px; border: none; outline: none; color: #fff; background: rgba(255,255,255,0.12); margin-right: 12px; }
  .btns button:last-child { margin-right: 0; }
  .btns #saveBtn { background: #5865f2; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div id="clock">00:00</div>
      <div id="date">--</div>
      <div id="news"><div class="lbl">ULTIME NOTIZIE</div><div id="newsText">Caricamento...</div></div>
    </div>
    <div class="rcol">
    <div class="top-right">
      <div class="weather-box">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg>
        <span id="weather">Caricamento...</span>
      </div>
      <button id="settingsBtn" onclick="openSettings()" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <button id="refreshBtn" onclick="refreshPage()" aria-label="Aggiorna pagina">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
      </button>
    </div>
    <div id="cal"></div>
    </div>
  </div>

  <div class="media-box">
    <div class="track">
      <div class="cover">
        <svg viewBox="0 0 24 24"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V7h7V3z"/></svg>
      </div>
      <div class="track-info">
        <div id="title">Nessun brano</div>
        <div id="artist">Avvia la musica sul PC</div>
      </div>
    </div>
    <div class="controls">
      <button id="modeBtn" onclick="toggleMode()">PC</button>
      <button onclick="sendCmd('previous')" aria-label="Precedente">
        <svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zM9.5 12l9 6.5v-13z"/></svg>
      </button>
      <button id="playBtn" onclick="sendCmd('play-pause')" aria-label="Play/Pausa">
        <svg viewBox="0 0 24 24"><path d="M2 5.5l9 6.5-9 6.5z"/><path d="M13 5.5h3.5v13H13zM18.5 5.5H22v13h-3.5z"/></svg>
      </button>
      <button onclick="sendCmd('next')" aria-label="Successivo">
        <svg viewBox="0 0 24 24"><path d="M15.5 6H18v12h-2.5zM5.5 5.5v13l9-6.5z"/></svg>
      </button>
    </div>
  </div>

  <div id="ytBox"></div>
  <div id="dim"></div>

  <div id="panel">
    <div class="card">
      <h2>Impostazioni</h2>

      <label for="fCity">Citt&agrave; per il meteo</label>
      <input type="text" id="fCity" placeholder="es. Milano (vuoto = usa il meteo del PC)" autocomplete="off">

      <label>Colore dello sfondo</label>
      <div id="swatches"></div>

      <div class="check">
        <input type="checkbox" id="fDim">
        <span>Luminosit&agrave; programmata</span>
      </div>

      <label for="fDay">Luminosit&agrave; di giorno: <span id="vDay"></span>%</label>
      <input type="range" id="fDay" min="10" max="100" step="5">

      <label for="fNight">Luminosit&agrave; di notte: <span id="vNight"></span>%</label>
      <input type="range" id="fNight" min="5" max="100" step="5">

      <div class="row">
        <div>
          <label for="fFrom">Notte dalle</label>
          <select id="fFrom"></select>
        </div>
        <div>
          <label for="fTo">Fino alle</label>
          <select id="fTo"></select>
        </div>
      </div>
      <div class="hint">La luminosit&agrave; viene ridotta oscurando lo schermo; non cambia quella reale del tablet.</div>

      <div class="check">
        <input type="checkbox" id="fCal">
        <span>Mostra il calendario</span>
      </div>

      <label for="fFont">Font della pagina</label>
      <select id="fFont"></select>

      <label for="fNews">Notizie (indirizzo feed RSS)</label>
      <input type="text" id="fNews" placeholder="Vuoto = nessuna notizia" autocomplete="off">
      <div class="hint">Predefinito: ANSA. Puoi usare il feed RSS di un altro giornale.</div>

      <label for="fYt">Playlist YouTube (modalit&agrave; YT)</label>
      <input type="text" id="fYt" placeholder="Link o ID della playlist" autocomplete="off">

      <div id="fMsg"></div>
      <div class="btns">
        <button id="cancelBtn" onclick="closeSettings()">Annulla</button>
        <button id="saveBtn" onclick="saveSettings()">Salva</button>
      </div>
    </div>
  </div>

<script src="playlist.js"></script>
<script>
  // ---- CONFIGURAZIONE ----
  // '' se la pagina viene servita dal PC (http://IP:8080).
  // Se la pagina e' salvata sul tablet, scrivi qui l'indirizzo del PC, es. 'http://192.168.1.50:8080'
  var PC_URL = '';
  // Coordinate predefinite per il meteo (default: Roma). Si cambiano dalle impostazioni.
  var LAT = 41.89, LON = 12.48;
  // ------------------------

  var DAYS = ['domenica', 'luned\u00ec', 'marted\u00ec', 'mercoled\u00ec', 'gioved\u00ec', 'venerd\u00ec', 'sabato'];
  var MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  var THEMES = [
    { a: '#1b1b32', b: '#0d0d16' }, // Notte
    { a: '#1a1a1a', b: '#000000' }, // Nero
    { a: '#16314f', b: '#08121f' }, // Blu
    { a: '#163b2e', b: '#08140f' }, // Verde
    { a: '#3a1b52', b: '#140820' }, // Viola
    { a: '#4a1a22', b: '#1a080b' }, // Rosso
    { a: '#2c2f36', b: '#121316' }  // Grigio
  ];
  var FONTS = [
    { n: 'Predefinito', css: 'sans-serif' },
    { n: 'Elegante (serif)', css: 'Georgia, "Times New Roman", serif' },
    { n: 'Monospazio', css: '"Courier New", Courier, monospace' },
    { n: 'Tondo', css: '"Trebuchet MS", Verdana, sans-serif' },
    { n: 'Moderno', css: '"Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif' }
  ];
  var MODES = ['pc', 'tablet', 'yt'];

  var DEFAULTS = { city: '', lat: LAT, lon: LON, theme: 0, dimOn: false, dayB: 100, nightB: 30, nightFrom: 22, nightTo: 7, ytList: 'PLdga5mgkmErO8YwmbefS47kRgvPg5XGpL', cal: true, font: 0, news: 'https://www.ansa.it/sito/ansait_rss.xml' };
  var cfg = loadCfg();

  var busy = false;
  var lastWx = 0;
  var mode = 'pc';
  try { var m0 = localStorage.getItem('mode'); mode = (m0 === 'tablet' || m0 === 'yt') ? m0 : 'pc'; } catch (e) {}

  var tracks = (typeof PLAYLIST !== 'undefined') ? PLAYLIST : [];
  var idx = 0;
  var audio = new Audio();

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  // ---- Impostazioni: salvataggio/lettura ----
  function loadCfg() {
    var c = {}, k;
    for (k in DEFAULTS) { if (DEFAULTS.hasOwnProperty(k)) { c[k] = DEFAULTS[k]; } }
    try {
      var s = JSON.parse(localStorage.getItem('cfg') || '{}');
      for (k in s) { if (DEFAULTS.hasOwnProperty(k)) { if (k === 'ytList' && !s[k]) { continue; } c[k] = s[k]; } }
    } catch (e) {}
    return c;
  }
  function saveCfg() { try { localStorage.setItem('cfg', JSON.stringify(cfg)); } catch (e) {} }

  // ---- Tema (sfondo) ----
  function applyTheme() {
    var t = THEMES[cfg.theme] || THEMES[0];
    var s = document.body.style;
    s.background = t.b;
    s.background = '-webkit-linear-gradient(top, ' + t.a + ' 0%, ' + t.b + ' 100%)';
    s.background = 'linear-gradient(180deg, ' + t.a + ' 0%, ' + t.b + ' 100%)';
  }

  var lastCalDay = -1;
  function renderCal() {
    var box = $('cal');
    if (!cfg.cal) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    var d = new Date(), y = d.getFullYear(), mo = d.getMonth(), today = d.getDate();
    var offset = (new Date(y, mo, 1).getDay() + 6) % 7;
    var dim = new Date(y, mo + 1, 0).getDate();
    var h = '<div class="ct">' + MONTHS[mo] + ' ' + y + '</div><table><tr>';
    var names = ['L', 'M', 'M', 'G', 'V', 'S', 'D'], i, c, day = 1 - offset;
    for (i = 0; i < 7; i++) { h += '<th>' + names[i] + '</th>'; }
    h += '</tr>';
    while (day <= dim) {
      h += '<tr>';
      for (c = 0; c < 7; c++, day++) {
        if (day < 1 || day > dim) { h += '<td></td>'; }
        else if (day === today) { h += '<td class="t"><span>' + day + '</span></td>'; }
        else { h += '<td' + (c === 6 ? ' class="su"' : '') + '>' + day + '</td>'; }
      }
      h += '</tr>';
    }
    box.innerHTML = h + '</table>';
  }

  function applyFont() {
    document.body.style.fontFamily = (FONTS[cfg.font] || FONTS[0]).css;
  }

  // ---- Notizie (feed RSS tramite rss2json) ----
  var newsItems = [], newsIdx = 0, lastNews = 0;

  function decodeHtml(t) {
    var e = document.createElement('textarea');
    e.innerHTML = t;
    return e.value;
  }

  function showNews() {
    var box = $('newsText'), n = $('news');
    n.style.opacity = '0';
    setTimeout(function() {
      box.textContent = newsItems.length ? newsItems[newsIdx % newsItems.length] : 'Notizie non disponibili';
      n.style.opacity = '1';
    }, 300);
  }

  function fetchNews() {
    if (!cfg.news) { $('news').style.display = 'none'; return; }
    $('news').style.display = 'block';
    var now = new Date().getTime();
    if (now - lastNews < 900000) { return; }
    lastNews = now;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(cfg.news), true);
    xhr.timeout = 10000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) { return; }
      var ok = false;
      if (xhr.status === 200) {
        try {
          var r = JSON.parse(xhr.responseText), list = [];
          for (var i = 0; r.items && i < r.items.length && i < 10; i++) { list.push(decodeHtml(r.items[i].title)); }
          if (list.length) { newsItems = list; newsIdx = 0; ok = true; showNews(); }
        } catch (e) {}
      }
      if (!ok) {
        lastNews = new Date().getTime() - 840000; // riprova tra 1 minuto
        if (!newsItems.length) { $('newsText').textContent = 'Notizie non disponibili'; }
      }
    };
    xhr.send();
  }

  // ---- Luminosita' programmata ----
  var lastDim = -1;
  function applyBrightness() {
    var level = 100;
    if (cfg.dimOn) {
      var h = new Date().getHours();
      var f = cfg.nightFrom, t = cfg.nightTo, night;
      if (f === t) { night = false; }
      else if (f > t) { night = (h >= f || h < t); }
      else { night = (h >= f && h < t); }
      level = night ? cfg.nightB : cfg.dayB;
    }
    if (level === lastDim) { return; }
    lastDim = level;
    $('dim').style.opacity = String(1 - level / 100);
  }

  function updateClock() {
    var now = new Date();
    $('clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    $('date').textContent = DAYS[now.getDay()] + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()];
    if (now.getDate() !== lastCalDay) { lastCalDay = now.getDate(); renderCal(); }
    applyBrightness();
  }

  // ---- Meteo (Open-Meteo): usato se hai scelto una citta' o se il PC non risponde ----
  function wxText(code) {
    if (code === 0) { return 'Sereno'; }
    if (code <= 3) { return 'Nuvoloso'; }
    if (code <= 48) { return 'Nebbia'; }
    if (code <= 67) { return 'Pioggia'; }
    if (code <= 77) { return 'Neve'; }
    if (code <= 82) { return 'Rovesci'; }
    return 'Temporale';
  }

  function fetchWeatherFallback() {
    var now = new Date().getTime();
    if (now - lastWx < 900000) { return; }
    lastWx = now;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + cfg.lat + '&longitude=' + cfg.lon + '&current_weather=true', true);
    xhr.timeout = 8000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status === 200) {
        try {
          var w = JSON.parse(xhr.responseText).current_weather;
          $('weather').textContent = Math.round(w.temperature) + '\u00b0C ' + wxText(w.weathercode) + (cfg.city ? ' \u00b7 ' + cfg.city : '');
        } catch (e) {}
      } else {
        lastWx = 0;
        $('weather').textContent = 'Meteo non disponibile';
      }
    };
    xhr.send();
  }

  // ---- Modalita' PC ----
  function fetchStatus() {
    if (busy) { return; }
    busy = true;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', PC_URL + '/api/status', true);
    xhr.timeout = 6000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) { return; }
      busy = false;
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (cfg.city) { fetchWeatherFallback(); }
          else { $('weather').textContent = data.weather; }
          if (mode === 'pc') {
            $('title').textContent = data.media.title;
            $('artist').textContent = data.media.artist;
          }
        } catch (e) {}
      } else {
        if (mode === 'pc') {
          $('title').textContent = 'PC non raggiungibile';
          $('artist').textContent = 'Passa alla modalit\u00e0 TABLET o YT per la musica';
        }
        fetchWeatherFallback();
      }
    };
    xhr.send();
  }

  // ---- Modalita' Tablet ----
  function trackName(path) {
    var n = path.split('/').pop().replace(/\.[^.]+$/, '');
    try { n = decodeURIComponent(n); } catch (e) {}
    return n;
  }

  function loadTrack(i, autoplay) {
    if (!tracks.length) {
      $('title').textContent = 'Nessun brano';
      $('artist').textContent = 'Metti gli MP3 in musica/ e aggiorna playlist.js';
      return;
    }
    idx = (i + tracks.length) % tracks.length;
    audio.src = tracks[idx];
    $('title').textContent = trackName(tracks[idx]);
    $('artist').textContent = 'Tablet \u2022 ' + (idx + 1) + '/' + tracks.length;
    if (autoplay) { audio.play(); }
  }

  audio.onended = function() { loadTrack(idx + 1, true); };

  function tabletCmd(cmd) {
    if (!tracks.length) { loadTrack(0, false); return; }
    if (!audio.src) { loadTrack(0, cmd === 'play-pause'); return; }
    if (cmd === 'next') { loadTrack(idx + 1, true); }
    else if (cmd === 'previous') { loadTrack(idx - 1, true); }
    else { if (audio.paused) { audio.play(); } else { audio.pause(); } }
  }

  // ---- Modalita' YouTube (playlist) ----
  var ytPlayer = null, ytLoading = false, ytWantPlay = false, ytErrs = 0, ytStuck = 0, ytIntent = false;

  function loadYT() {
    if (ytLoading) { return; }
    ytLoading = true;
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function() {
      ytLoading = false;
      if (mode === 'yt') {
        $('title').textContent = 'YouTube non raggiungibile';
        $('artist').textContent = 'Controlla la connessione o usa un altro tablet/browser';
      }
    };
    document.body.appendChild(s);
  }

  window.onYouTubeIframeAPIReady = function() {
    if (!cfg.ytList) { return; }
    ytPlayer = new YT.Player('ytBox', {
      height: '200', width: '200',
      playerVars: { listType: 'playlist', list: cfg.ytList, playsinline: 1, controls: 0 },
      events: {
        onReady: function() { if (ytWantPlay) { try { ytPlayer.playVideo(); } catch (e) {} } updateYT(); },
        onStateChange: function(e) { if (e && e.data === 1) { ytErrs = 0; ytStuck = 0; } updateYT(); },
        onError: function(e) {
          var c = e && e.data;
          // video non disponibile / non incorporabile: salta al successivo
          if ((c === 100 || c === 101 || c === 150 || c === 5) && ytErrs < 8) {
            ytErrs++;
            try { ytPlayer.nextVideo(); } catch (x) {}
            return;
          }
          $('title').textContent = 'Errore YouTube';
          $('artist').textContent = 'Controlla l\u2019ID della playlist (deve essere pubblica)';
        }
      }
    });
  };

  function updateYT() {
    if (mode !== 'yt') { return; }
    if (!cfg.ytList) {
      $('title').textContent = 'YouTube';
      $('artist').textContent = 'Imposta una playlist dalle impostazioni';
      return;
    }
    if (!ytPlayer || !ytPlayer.getVideoData) {
      $('title').textContent = 'YouTube';
      $('artist').textContent = 'Premi play per avviare';
      return;
    }
    try {
      var d = ytPlayer.getVideoData();
      if (d && d.title) {
        $('title').textContent = d.title;
        $('artist').textContent = 'YouTube \u2022 ' + (d.author || '');
      }
    } catch (e) {}
  }

  // Controllo automatico: se la musica si ferma o resta in caricamento, riprova
  function ytWatch() {
    if (mode !== 'yt' || !ytPlayer || !ytIntent || !ytPlayer.getPlayerState) { return; }
    try {
      var st = ytPlayer.getPlayerState();
      if (st === 1) { ytStuck = 0; return; }
      ytStuck += 3;
      if (st === 3) {
        if (ytStuck === 21) { ytPlayer.seekTo(ytPlayer.getCurrentTime(), true); }
        else if (ytStuck >= 45) { ytStuck = 0; ytPlayer.nextVideo(); }
      } else if (st === -1 || st === 2 || st === 5) {
        if (ytStuck >= 6) { ytStuck = 0; ytPlayer.playVideo(); }
      }
    } catch (e) {}
  }

  function ytCmd(cmd) {
    if (!cfg.ytList) { updateYT(); return; }
    if (!ytPlayer) {
      ytWantPlay = true;
      ytIntent = true;
      $('title').textContent = 'YouTube';
      $('artist').textContent = 'Caricamento... se non parte, premi play di nuovo';
      if (window.YT && window.YT.Player) { window.onYouTubeIframeAPIReady(); }
      else { loadYT(); }
      return;
    }
    try {
      ytStuck = 0;
      if (cmd === 'next') { ytIntent = true; ytPlayer.nextVideo(); }
      else if (cmd === 'previous') { ytIntent = true; ytPlayer.previousVideo(); }
      else if (ytPlayer.getPlayerState() === 1) { ytIntent = false; ytPlayer.pauseVideo(); }
      else { ytIntent = true; ytPlayer.playVideo(); }
    } catch (e) {}
    setTimeout(updateYT, 800);
  }

  // ---- Comuni ----
  function sendCmd(cmd) {
    if (mode === 'tablet') { tabletCmd(cmd); return; }
    if (mode === 'yt') { ytCmd(cmd); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', PC_URL + '/api/cmd/' + cmd, true);
    xhr.send();
    setTimeout(fetchStatus, 300);
  }

  function applyMode() {
    $('modeBtn').textContent = mode === 'pc' ? 'PC' : (mode === 'tablet' ? 'TABLET' : 'YT');
    if (mode !== 'tablet') { audio.pause(); }
    if (mode !== 'yt') { ytIntent = false; }
    if (mode !== 'yt' && ytPlayer) { try { ytPlayer.pauseVideo(); } catch (e) {} }
    if (mode === 'tablet') {
      if (audio.src) {
        $('title').textContent = trackName(tracks[idx]);
        $('artist').textContent = 'Tablet \u2022 ' + (idx + 1) + '/' + tracks.length;
      } else {
        loadTrack(0, false);
      }
    } else if (mode === 'yt') {
      updateYT();
    } else {
      fetchStatus();
    }
  }

  function toggleMode() {
    var i = 0;
    for (var k = 0; k < MODES.length; k++) { if (MODES[k] === mode) { i = k; } }
    mode = MODES[(i + 1) % MODES.length];
    try { localStorage.setItem('mode', mode); } catch (e) {}
    applyMode();
  }

  function refreshPage() {
    // Ricarica la pagina saltando la cache, cosi' le modifiche vengono applicate
    var url = location.href.split('#')[0].replace(/([?&])_r=\d+&?/, '$1').replace(/[?&]$/, '');
    location.href = url + (url.indexOf('?') === -1 ? '?' : '&') + '_r=' + new Date().getTime();
  }

  // ---- Pannello impostazioni ----
  var tempTheme = 0;

  function buildSettingsUI() {
    var i, o, sel, box = $('swatches');
    for (i = 0; i < THEMES.length; i++) {
      (function(n) {
        var b = document.createElement('button');
        b.className = 'sw';
        b.style.background = THEMES[n].a;
        b.style.background = '-webkit-linear-gradient(135deg, ' + THEMES[n].a + ', ' + THEMES[n].b + ')';
        b.style.background = 'linear-gradient(135deg, ' + THEMES[n].a + ', ' + THEMES[n].b + ')';
        b.onclick = function() { tempTheme = n; markSwatch(); };
        box.appendChild(b);
      })(i);
    }
    var ids = ['fFrom', 'fTo'];
    for (var k = 0; k < ids.length; k++) {
      sel = $(ids[k]);
      for (i = 0; i < 24; i++) {
        o = document.createElement('option');
        o.value = i; o.text = pad(i) + ':00';
        sel.appendChild(o);
      }
    }
    var fs = $('fFont');
    for (i = 0; i < FONTS.length; i++) {
      o = document.createElement('option');
      o.value = i; o.text = FONTS[i].n;
      fs.appendChild(o);
    }
    $('fDay').oninput = function() { $('vDay').textContent = $('fDay').value; };
    $('fNight').oninput = function() { $('vNight').textContent = $('fNight').value; };
  }

  function markSwatch() {
    var b = $('swatches').getElementsByTagName('button');
    for (var i = 0; i < b.length; i++) { b[i].className = 'sw' + (i === tempTheme ? ' sel' : ''); }
  }

  function openSettings() {
    $('fCity').value = cfg.city;
    $('fDim').checked = !!cfg.dimOn;
    $('fDay').value = cfg.dayB; $('vDay').textContent = cfg.dayB;
    $('fNight').value = cfg.nightB; $('vNight').textContent = cfg.nightB;
    $('fFrom').value = cfg.nightFrom;
    $('fTo').value = cfg.nightTo;
    $('fYt').value = cfg.ytList;
    $('fCal').checked = !!cfg.cal;
    $('fFont').value = cfg.font;
    $('fNews').value = cfg.news;
    $('fMsg').textContent = '';
    tempTheme = cfg.theme;
    markSwatch();
    $('panel').className = 'open';
  }

  function closeSettings() { $('panel').className = ''; }

  function parseList(v) {
    v = v.replace(/^\s+|\s+$/g, '');
    var m = v.match(/[?&]list=([\w-]+)/);
    return m ? m[1] : v;
  }

  function saveSettings() {
    var newCity = $('fCity').value.replace(/^\s+|\s+$/g, '');
    var oldList = cfg.ytList;
    cfg.dimOn = $('fDim').checked;
    cfg.dayB = parseInt($('fDay').value, 10);
    cfg.nightB = parseInt($('fNight').value, 10);
    cfg.nightFrom = parseInt($('fFrom').value, 10);
    cfg.nightTo = parseInt($('fTo').value, 10);
    cfg.theme = tempTheme;
    cfg.ytList = parseList($('fYt').value);
    cfg.cal = $('fCal').checked;
    cfg.font = parseInt($('fFont').value, 10);
    cfg.news = $('fNews').value.replace(/^\s+|\s+$/g, '');

    function done() {
      saveCfg();
      applyTheme();
      applyFont();
      lastCalDay = -1;
      updateClock();
      lastNews = 0;
      lastDim = -1;
      applyBrightness();
      closeSettings();
      lastWx = 0;
      tick();
      if (cfg.ytList !== oldList) {
        if (ytPlayer && cfg.ytList) { try { ytPlayer.cuePlaylist({ listType: 'playlist', list: cfg.ytList }); } catch (e) {} }
        updateYT();
      }
    }

    if (newCity === cfg.city) { done(); return; }
    if (!newCity) { cfg.city = ''; cfg.lat = LAT; cfg.lon = LON; done(); return; }

    $('fMsg').style.color = '#9fa3c4';
    $('fMsg').textContent = 'Cerco la citt\u00e0...';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://geocoding-api.open-meteo.com/v1/search?count=1&language=it&name=' + encodeURIComponent(newCity), true);
    xhr.timeout = 8000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) { return; }
      $('fMsg').style.color = '#ff8a8a';
      if (xhr.status === 200) {
        try {
          var r = JSON.parse(xhr.responseText);
          if (r.results && r.results.length) {
            cfg.city = r.results[0].name;
            cfg.lat = r.results[0].latitude;
            cfg.lon = r.results[0].longitude;
            done();
            return;
          }
        } catch (e) {}
        $('fMsg').textContent = 'Citt\u00e0 non trovata';
      } else {
        $('fMsg').textContent = 'Impossibile cercare la citt\u00e0 (connessione?)';
      }
    };
    xhr.send();
  }

  function tick() {
    fetchNews();
    if (mode === 'pc') { fetchStatus(); }
    else {
      fetchWeatherFallback();
      if (mode === 'yt') { updateYT(); ytWatch(); }
    }
  }

  buildSettingsUI();
  applyTheme();
  applyFont();
  setInterval(function() { if (newsItems.length > 1) { newsIdx = (newsIdx + 1) % newsItems.length; showNews(); } }, 10000);
  setInterval(updateClock, 1000);
  setInterval(tick, 3000);
  updateClock();
  applyMode();
  tick();
</script>
</body>
